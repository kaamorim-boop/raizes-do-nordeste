<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Raízes do Nordeste</title><link rel="stylesheet" href="../css/style.css"></head><body class="cart-page"><header class="simple-header"><a class="brand" href="../index.html"><span class="brand-mark">🌵</span><span><strong>Raízes</strong><strong>do Nordeste</strong><small>LANCHONETES</small></span></a><a class="back-link" href="../index.html">← Início</a></header><main class="auth-shell"><section class="auth-card"><span class="eyebrow">Área do cliente</span><h1>Entrar na sua conta</h1><p class="helper">Acesse seu perfil, pontos e histórico de pedidos.</p><form id="login-form"><div class="field"><label for="login-email">E-mail</label><input id="login-email" type="email" required autocomplete="email" placeholder="voce@email.com"></div><div class="field"><label for="login-password">Senha</label><input id="login-password" type="password" required minlength="4" autocomplete="current-password" placeholder="••••••••"></div><button class="primary-action full-width" type="submit">Entrar</button></form><p class="auth-switch">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p><div id="login-message" class="status-note" hidden></div><p class="demo-alert">🧪 Projeto acadêmico: autenticação simulada. Nenhuma senha é enviada a um servidor real.</p></section></main><script src="../js/login.js"></script></body></html>
