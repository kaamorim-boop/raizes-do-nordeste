<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro | Raízes do Nordeste</title><link rel="stylesheet" href="../css/style.css"></head><body class="cart-page"><header class="simple-header"><a class="brand" href="../index.html"><span class="brand-mark">🌵</span><span><strong>Raízes</strong><strong>do Nordeste</strong><small>LANCHONETES</small></span></a><a class="back-link" href="login.html">← Entrar</a></header><main class="auth-shell"><section class="auth-card"><span class="eyebrow">Novo cliente</span><h1>Crie sua conta</h1><p class="helper">Cadastre apenas os dados necessários para usar a experiência.</p><form id="register-form"><div class="form-grid"><div class="field full"><label for="reg-name">Nome completo</label><input id="reg-name" required autocomplete="name"></div><div class="field"><label for="reg-email">E-mail</label><input id="reg-email" type="email" required autocomplete="email"></div><div class="field"><label for="reg-phone">Telefone</label><input id="reg-phone" type="tel" required autocomplete="tel"></div><div class="field full"><label for="reg-password">Senha</label><input id="reg-password" type="password" minlength="4" required autocomplete="new-password"><small>Use uma senha fictícia para esta demonstração.</small></div></div><label class="privacy-check"><input id="privacy-consent" type="checkbox" required><span>Li o aviso de privacidade e concordo com o tratamento dos dados necessários para cadastro, pedidos e fidelidade.</span></label><label class="privacy-check"><input id="marketing-consent" type="checkbox"><span>Quero receber promoções e novidades. (Opcional)</span></label><button class="primary-action full-width" type="submit">Criar conta</button></form><div id="register-message" class="status-note" hidden></div></section></main><script src="../js/cadastro.js"></script><script>document.querySelectorAll("form").forEach(f=>f.addEventListener("submit",e=>{if(!f.checkValidity()){e.preventDefault(); f.reportValidity();}}));</script></body></html>
